<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06152e">

<title>Bluewings Player Quiz</title>

<style>
:root{
  --blue:#0b4da2;
  --deep:#06152e;
  --red:#e32645;
  --text:#f7fbff;
  --muted:#9fb5d2;
  --line:rgba(255,255,255,.13);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--deep);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.screen{
  display:none;
  min-height:100vh;
  padding:22px 18px 34px;
  max-width:560px;
  margin:auto;
}

.screen.active{
  display:flex;
  flex-direction:column;
}

/* START */

#splash{
  max-width:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(
      circle at 50% 28%,
      #1761ba 0,
      #0b3470 32%,
      #06152e 72%
    );
}

.crest{
  width:160px;
  max-height:190px;
  object-fit:contain;
  filter:drop-shadow(0 18px 28px rgba(0,0,0,.35));
  animation:pop .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.65) translateY(20px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.brand{
  font-size:27px;
  font-weight:950;
  margin-top:24px;
}

.sub{
  color:#a9c8ee;
  letter-spacing:4px;
  font-size:12px;
  margin-top:7px;
}

.primary{
  border:0;
  border-radius:17px;
  padding:17px;
  width:100%;
  background:white;
  color:#08244c;
  font-weight:900;
  font-size:17px;
  margin-top:25px;
}

#splash .primary{
  max-width:330px;
  margin-top:48px;
}

.enter-hint{
  font-size:12px;
  opacity:.55;
  margin-top:12px;
}

/* MENU */

.kicker{
  font-size:12px;
  letter-spacing:2.5px;
  color:#73a9e7;
  font-weight:900;
}

.title{
  font-size:31px;
  line-height:1.15;
  margin:8px 0;
}

.desc{
  color:var(--muted);
  line-height:1.6;
  margin:0 0 22px;
}

.mode-title{
  font-size:14px;
  font-weight:900;
  color:#bcd3ee;
  margin:18px 0 8px;
}

.mode-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.game-card{
  border:1px solid var(--line);
  background:rgba(255,255,255,.065);
  color:white;
  border-radius:20px;
  padding:20px 15px;
  text-align:left;
  min-height:145px;
}

.game-card:hover{
  background:rgba(255,255,255,.1);
}

.game-card.hard{
  border-color:rgba(227,38,69,.5);
  background:
    linear-gradient(
      145deg,
      rgba(227,38,69,.16),
      rgba(255,255,255,.045)
    );
}

.game-card .icon{
  font-size:27px;
}

.game-card b{
  display:block;
  font-size:18px;
  margin:12px 0 5px;
}

.game-card span{
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}

.game-card.hard b{
  color:#ff91a4;
}

/* QUIZ */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.back{
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:white;
  border-radius:12px;
  padding:10px 13px;
}

.progress{
  font-weight:900;
  color:#bdd0e8;
}

.badge{
  display:inline-block;
  align-self:flex-start;
  padding:6px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:950;
  letter-spacing:1px;
  margin-bottom:10px;
}

.badge.normal{
  background:#155ba9;
}

.badge.hard{
  background:#b7223d;
}

.visual{
  height:350px;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 35%,
      #185eb2,
      #0b326b 55%,
      #071a38
    );
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.player-img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}

.number{
  font-size:145px;
  font-weight:1000;
  font-style:italic;
  line-height:1;
  align-self:center;
  text-shadow:6px 6px 0 var(--red);
}

.question{
  font-size:21px;
  font-weight:950;
  margin:21px 0 14px;
}

/* NORMAL */

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  position:relative;
  border:1px solid var(--line);
  background:rgba(255,255,255,.07);
  color:white;
  border-radius:16px;
  padding:16px 10px;
  min-height:64px;
  font-weight:850;
  font-size:16px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.answer:hover{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.3);
}

.answer-key{
  position:absolute;
  left:11px;
  top:50%;
  transform:translateY(-50%);

  width:27px;
  height:27px;

  border-radius:8px;

  background:rgba(255,255,255,.11);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
  color:#a9c7ea;
  font-weight:950;
}

.answer.correct{
  background:#14754b;
  border-color:#47d18e;
}

.answer.wrong{
  background:#8a2940;
  border-color:#ff6984;
}

.answer.correct .answer-key,
.answer.wrong .answer-key{
  color:white;
}

.keyboard-help{
  color:#7894b6;
  font-size:12px;
  text-align:center;
  margin-top:10px;
}

/* HARD */

.hard-box{
  display:none;
}

.name-input{
  width:100%;
  height:62px;
  border-radius:17px;
  border:2px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);
  color:white;
  padding:0 18px;
  font-size:20px;
  font-weight:850;
  outline:none;
}

.name-input:focus{
  border-color:#599ce8;
}

.name-input::placeholder{
  color:#7089a8;
}

.submit{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:17px;
  padding:17px;
  background:#0b4da2;
  color:white;
  font-weight:950;
}

.help{
  color:#7894b6;
  font-size:12px;
  text-align:center;
  margin-top:9px;
}

/* PROFILE */

.result-label{
  text-align:center;
  font-size:22px;
  font-weight:950;
  margin:5px 0 17px;
  line-height:1.45;
}

.profile-card{
  border:1px solid var(--line);
  background:linear-gradient(155deg,#10386f,#0a2246);
  border-radius:25px;
  overflow:hidden;
}

.profile-photo{
  height:340px;
  background:
    radial-gradient(
      circle at 50% 30%,
      #1b65bb,
      #0a2a5a
    );
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}

.profile-body{
  padding:21px;
}

.no{
  color:#7db5f4;
  font-weight:900;
}

.name{
  font-size:34px;
  font-weight:1000;
  margin:3px 0;
}

.pos{
  color:#d9e8f8;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.info{
  background:rgba(0,0,0,.18);
  border-radius:14px;
  padding:12px;
}

.info small{
  display:block;
  color:#88a4c5;
  margin-bottom:5px;
}

.info strong{
  font-size:15px;
}

/* RESULT */

.center{
  align-items:center;
  justify-content:center;
  text-align:center;
}

.score{
  font-size:78px;
  font-weight:1000;
  margin:14px 0;
}

.wrong-list{
  width:100%;
  text-align:left;
  margin-top:20px;
}

.wrong-chip{
  display:inline-block;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  padding:8px 11px;
  border-radius:999px;
  margin:4px;
  font-size:13px;
}

.secondary{
  background:#0b4da2;
  color:white;
}

.third{
  background:#173b6a;
  color:white;
}

@media(max-width:400px){

  .visual{
    height:310px;
  }

  .number{
    font-size:120px;
  }

  .game-card{
    min-height:135px;
    padding:17px 13px;
  }

}

</style>
</head>

<!-- START -->

<section id="splash" class="screen active">

<img
class="crest"
src="https://www.kleague.com/assets/images/emblem/emblem_K02.png"
alt="수원삼성">

<div class="brand">
SUWON BLUEWINGS
</div>

<div class="sub">
PLAYER QUIZ
</div>

<button class="primary" id="startBtn">
게임 시작
</button>

<div class="enter-hint">
PC에서는 Enter 키로 시작
</div>

</section>


<!-- MENU -->

<section id="menu" class="screen">

<div style="margin-top:15px">

<div class="kicker">
2026 SUWON BLUEWINGS
</div>

<h1 class="title">
선수들을<br>
얼마나 알고 있나요?
</h1>

<p class="desc">
매 게임 현재 선수단에서 랜덤 10명이 등장합니다.
</p>

</div>


<div class="mode-title">
👤 얼굴 보고 맞히기
</div>

<div class="mode-row">

<button
class="game-card"
data-mode="face"
data-level="normal">

<div class="icon">⚽</div>

<b>Normal</b>

<span>
선수 사진을 보고<br>
4지선다로 맞히기
</span>

</button>


<button
class="game-card hard"
data-mode="face"
data-level="hard">

<div class="icon">🔥</div>

<b>Hard</b>

<span>
선수 사진을 보고<br>
이름 직접 입력
</span>

</button>

</div>


<div class="mode-title">
🔢 등번호 보고 맞히기
</div>

<div class="mode-row">

<button
class="game-card"
data-mode="number"
data-level="normal">

<div class="icon">⚽</div>

<b>Normal</b>

<span>
등번호를 보고<br>
4지선다로 맞히기
</span>

</button>


<button
class="game-card hard"
data-mode="number"
data-level="hard">

<div class="icon">🔥</div>

<b>Hard</b>

<span>
등번호를 보고<br>
이름 직접 입력
</span>

</button>

</div>

</section>


<!-- QUIZ -->

<section id="quiz" class="screen">

<div class="top">

<button class="back" id="menuBtn">
← 메뉴
</button>

<div class="progress" id="progress"></div>

</div>

<div id="badge" class="badge"></div>

<div class="visual" id="visual"></div>

<div class="question">
이 선수는 누구일까요?
</div>

<div class="answers" id="answers"></div>

<div
id="normalKeyboardHelp"
class="keyboard-help">
키보드 1 · 2 · 3 · 4 로 선택
</div>

<div class="hard-box" id="hardBox">

<input
id="nameInput"
class="name-input"
type="text"
autocomplete="off"
autocorrect="off"
spellcheck="false"
placeholder="선수 이름 입력">

<button id="submitBtn" class="submit">
정답 확인
</button>

<div class="help">
띄어쓰기는 무시됩니다 · Enter로 정답 확인
</div>

</div>

</section>


<!-- PROFILE -->

<section id="profile" class="screen">

<div
id="resultLabel"
class="result-label">
</div>

<div class="profile-card">

<div class="profile-photo">

<img
id="profileImg"
alt="선수 사진">

</div>

<div class="profile-body">

<div id="pNo" class="no"></div>

<div id="pName" class="name"></div>

<div id="pPos" class="pos"></div>

<div class="grid">

<div class="info">
<small>등번호</small>
<strong id="pNumber"></strong>
</div>

<div class="info">
<small>포지션</small>
<strong id="pPosition"></strong>
</div>

<div class="info">
<small>생년월일</small>
<strong id="pBirth"></strong>
</div>

<div class="info">
<small>신장 / 체중</small>
<strong id="pBody"></strong>
</div>

</div>

</div>
</div>

<button class="primary" id="nextBtn">
다음 선수 →　<span style="opacity:.5">Enter</span>
</button>

</section>


<!-- RESULT -->

<section id="result" class="screen center">

<div class="kicker">
QUIZ COMPLETE
</div>

<h1 class="title">
경기 종료!
</h1>

<div id="finalScore" class="score"></div>

<div id="scoreText" class="desc"></div>

<div id="wrongList" class="wrong-list"></div>

<button
id="retryWrong"
class="primary"
style="display:none">
틀린 선수 다시 풀기
</button>

<button
id="newGameBtn"
class="primary secondary">
새로운 랜덤 10명
</button>

<button
id="homeBtn"
class="primary third">
게임 선택으로
</button>

</section>

/* ==============================
   FOREIGN DUMMY
============================== */

const foreignDummy = [

{name:"세징야",foreign:true},
{name:"라마스",foreign:true},
{name:"오베르단",foreign:true},
{name:"가브리엘",foreign:true},
{name:"플라나",foreign:true},
{name:"마테우스",foreign:true}

];


/* ==============================
   STATE
============================== */

let mode = "face";
let level = "normal";

let questions = [];
let index = 0;
let score = 0;
let current = null;
let wrong = [];

let lastMode = "face";
let lastLevel = "normal";

let hardSubmitting = false;
let normalSubmitting = false;

const $ = id =>
document.getElementById(id);


/* ==============================
   SCREEN
============================== */

function show(id){

document
.querySelectorAll(".screen")
.forEach(
screen =>
screen.classList.remove("active")
);

$(id)
.classList.add("active");

window.scrollTo(0,0);

}


/* ==============================
   SHUFFLE
============================== */

function shuffle(array){

const a = [...array];

for(
let i = a.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() *
(i + 1)
);

[
a[i],
a[j]
] = [
a[j],
a[i]
];

}

return a;

}


/* ==============================
   START GAME
============================== */

function startGame(
gameMode,
gameLevel,
customPlayers = null
){

mode = gameMode;
level = gameLevel;

lastMode = mode;
lastLevel = level;

index = 0;
score = 0;
wrong = [];

let pool;


/* FACE */

if(mode === "face"){

pool =
players.filter(
p =>
p.face === true &&
p.image
);

}


/* NUMBER */

else{

pool =
[...players];

}


/* RETRY */

if(customPlayers){

pool =
customPlayers.filter(
p =>
mode !== "face" ||
p.face === true
);

questions =
shuffle(pool);

}


/* RANDOM 10 */

else{

questions =
shuffle(pool)
.slice(0,10);

}


show("quiz");

loadQuestion();

}


/* ==============================
   LOAD QUESTION
============================== */

function loadQuestion(){

hardSubmitting = false;
normalSubmitting = false;

current =
questions[index];


$("progress")
.textContent =
`${index + 1} / ${questions.length}`;


$("badge")
.textContent =
level === "hard"
?
"🔥 HARD"
:
"⚽ NORMAL";


$("badge")
.className =
level === "hard"
?
"badge hard"
:
"badge normal";


/* FACE */

if(mode === "face"){

$("visual")
.innerHTML = `

<img
class="player-img"
src="${current.image}"
alt="선수 프로필 사진"
onerror="imageError()">

`;

}


/* NUMBER */

else{

$("visual")
.innerHTML = `

<div class="number">
${current.number}
</div>

`;

}


/* NORMAL */

if(level === "normal"){

$("answers")
.style.display =
"grid";

$("normalKeyboardHelp")
.style.display =
"block";

$("hardBox")
.style.display =
"none";

createChoices();

}


/* HARD */

else{

$("answers")
.style.display =
"none";

$("normalKeyboardHelp")
.style.display =
"none";

$("hardBox")
.style.display =
"block";

$("nameInput")
.value = "";


setTimeout(
() => {

$("nameInput")
.focus();

},
100
);

}

}


/* ==============================
   IMAGE ERROR
============================== */

function imageError(){

const unused =
players.filter(
p =>

p.face === true

&&
p.image

&&
!questions.some(
q =>
q.name === p.name
)

);


if(unused.length){

questions[index] =
shuffle(unused)[0];

loadQuestion();

}

else{

$("visual")
.innerHTML = `

<div style="
align-self:center;
padding:30px;
text-align:center;
color:#b8cae0;
">

사진을 불러오지 못했습니다.

</div>

`;

}

}


/* ==============================
   NORMAL CHOICES
============================== */

function createChoices(){

let wrongChoices;


/* KOREAN */

if(!current.foreign){

wrongChoices =

shuffle(

players.filter(
p =>
!p.foreign &&
p.name !== current.name
)

)

.slice(0,3);

}


/* FOREIGN */

else{

wrongChoices =

shuffle(

players.filter(
p =>
p.foreign &&
p.name !== current.name
)

)

.slice(0,3);


if(
wrongChoices.length < 3
){

wrongChoices = [

...wrongChoices,

...shuffle(
foreignDummy
)
.slice(
0,
3 - wrongChoices.length
)

];

}

}


const choices =

shuffle([

current,
...wrongChoices

]);


$("answers")
.innerHTML = "";


choices.forEach(
(player,choiceIndex) => {

const button =
document.createElement("button");

button.className =
"answer";

button.dataset.choice =
choiceIndex + 1;


/* 키보드 번호 + 선수 이름 */

button.innerHTML = `

<span class="answer-key">
${choiceIndex + 1}
</span>

<span>
${player.name}
</span>

`;


button.onclick =
() =>
checkNormal(
player,
button
);


$("answers")
.appendChild(
button
);

});

}


/* ==============================
   NORMAL CHECK
============================== */

function checkNormal(
selected,
button
){

/* 중복 입력 방지 */

if(normalSubmitting){
return;
}

normalSubmitting = true;


const buttons = [

...document
.querySelectorAll(".answer")

];


buttons.forEach(
b =>
b.disabled = true
);


const correct =
selected.name ===
current.name;


if(correct){

score++;

button
.classList
.add("correct");

}

else{

wrong.push(current);

button
.classList
.add("wrong");


const right =
buttons.find(
b => {

const name =
b.querySelector(
"span:last-child"
);

return (
name &&
name.textContent.trim()
===
current.name
);

}
);


if(right){

right
.classList
.add("correct");

}

}


setTimeout(
() =>
showProfile(correct),
450
);

}


/* ==============================
   KEYBOARD NORMAL ANSWER
============================== */

function selectNormalByNumber(
number
){

if(
level !== "normal"
){

return;

}


if(normalSubmitting){

return;

}


const buttons = [

...document
.querySelectorAll(
"#answers .answer"
)

];


const button =
buttons[number - 1];


if(!button){

return;

}


/* 실제 클릭과 완전히 동일하게 동작 */

button.click();

}


/* ==============================
   HARD NORMALIZE
============================== */

function normalizeName(value){

return value

.normalize("NFC")

.trim()

.replace(/\s+/g,"")

.toLowerCase();

}


/* ==============================
   HARD CHECK
============================== */

function checkHard(){

if(hardSubmitting){
return;
}


const typed =
$("nameInput")
.value;


if(!typed.trim()){

$("nameInput")
.focus();

return;

}


hardSubmitting = true;


const correct =

normalizeName(typed)

===

normalizeName(
current.name
);


if(correct){

score++;

}

else{

wrong.push(current);

}


showProfile(
correct,
typed
);

}


/* ==============================
   PROFILE
============================== */

function showProfile(
correct,
typed = ""
){

show("profile");


if(correct){

$("resultLabel")
.textContent =
"⭕ 정답입니다!";

}

else if(
level === "hard"
){

$("resultLabel")
.innerHTML =

`❌ ${typed}<br>

<span style="color:#8fb4df">

정답은 ${current.name} 선수!

</span>`;

}

else{

$("resultLabel")
.textContent =

`❌ 정답은 ${current.name} 선수!`;

}


/* PHOTO */

if(current.image){

$("profileImg")
.style.display =
"block";

$("profileImg")
.src =
current.image;

}

else{

$("profileImg")
.style.display =
"none";

}


$("pNo")
.textContent =
"NO. " +
current.number;


$("pName")
.textContent =
current.name;


$("pPos")
.textContent =
current.position ||
"수원삼성";


$("pNumber")
.textContent =
current.number;


$("pPosition")
.textContent =
current.position ||
"—";


$("pBirth")
.textContent =
current.birth ||
"—";


$("pBody")
.textContent =
current.body ||
"—";

}


/* ==============================
   NEXT
============================== */

function nextQuestion(){

index++;


if(
index >=
questions.length
){

finish();

return;

}


show("quiz");

loadQuestion();

}


/* ==============================
   RESULT
============================== */

function finish(){

show("result");


$("finalScore")
.textContent =
`${score} / ${questions.length}`;


const percent =

Math.round(
score /
questions.length *
100
);


$("scoreText")
.textContent =

`${lastLevel === "hard" ? "🔥 HARD" : "⚽ NORMAL"} · 정답률 ${percent}%`;


const uniqueWrong = [

...new Map(

wrong.map(
p => [
p.name,
p
]
)

).values()

];


if(
uniqueWrong.length
){

$("wrongList")
.innerHTML = `

<div style="
color:#9fb5d2;
margin-bottom:8px;
">

이번 게임에서 틀린 선수

</div>

`

+

uniqueWrong
.map(
p => `

<span class="wrong-chip">

NO.${p.number} ${p.name}

</span>

`
)
.join("");


$("retryWrong")
.style.display =
"block";


$("retryWrong")
.onclick =
() =>

startGame(
lastMode,
lastLevel,
uniqueWrong
);

}

else{

$("wrongList")
.innerHTML = `

<div style="
text-align:center;
font-size:18px;
">

🏆 10문제 전부 맞혔어요!

</div>

`;


$("retryWrong")
.style.display =
"none";

}

}


/* ==============================
   BUTTONS
============================== */

$("startBtn")
.onclick =
() =>
show("menu");


document
.querySelectorAll(
".game-card"
)
.forEach(
button => {

button.onclick =
() => {

startGame(

button.dataset.mode,

button.dataset.level

);

};

});


$("menuBtn")
.onclick =
() =>
show("menu");


$("submitBtn")
.onclick =
() =>
checkHard();


$("nextBtn")
.onclick =
() =>
nextQuestion();


$("newGameBtn")
.onclick =
() =>

startGame(
lastMode,
lastLevel
);


$("homeBtn")
.onclick =
() =>
show("menu");


/* ==================================
   KEYBOARD CONTROL v10
================================== */

document.addEventListener(
"keydown",
function(event){

const activeScreen =
document.querySelector(
".screen.active"
);


if(!activeScreen){

return;

}


/* ==========================
   NORMAL QUIZ

   1 / 2 / 3 / 4
   정답 선택
========================== */

if(
activeScreen.id === "quiz"
&&
level === "normal"
){

if(
["1","2","3","4"]
.includes(event.key)
){

event.preventDefault();

selectNormalByNumber(
Number(event.key)
);

return;

}

}


/* ==========================
   ENTER
========================== */

if(
event.key !== "Enter"
){

return;

}


/* START */

if(
activeScreen.id === "splash"
){

event.preventDefault();

show("menu");

return;

}


/* HARD QUIZ */

if(
activeScreen.id === "quiz"
&&
level === "hard"
){

event.preventDefault();

checkHard();

return;

}


/* PROFILE */

if(
activeScreen.id === "profile"
){

event.preventDefault();

nextQuestion();

return;

}

}
);

</script>
