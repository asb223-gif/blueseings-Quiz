<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071c3d">

<title>Bluewings Player Quiz</title>

<style>

:root{
  --blue:#0b4da2;
  --deep:#06152e;
  --red:#e32645;
  --text:#f7fbff;
  --muted:#9fb5d2;
  --line:rgba(255,255,255,.13);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--deep);
  color:var(--text);
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Pretendard",
  "Noto Sans KR",
  sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
}

.screen{
  display:none;
  min-height:100vh;
  padding:22px 18px 34px;
  max-width:560px;
  margin:auto;
}

.screen.active{
  display:flex;
  flex-direction:column;
}


/* =========================
   시작화면
========================= */

#splash{
  max-width:none;
  align-items:center;
  justify-content:center;
  text-align:center;

  background:
  radial-gradient(
    circle at 50% 28%,
    #1761ba 0,
    #0b3470 32%,
    #06152e 72%
  );
}

.crest{
  width:160px;
  max-height:190px;
  object-fit:contain;

  filter:
  drop-shadow(
    0 18px 28px
    rgba(0,0,0,.35)
  );

  animation:
  pop .8s
  cubic-bezier(.2,.8,.2,1);
}

@keyframes pop{

  from{
    opacity:0;
    transform:
    scale(.65)
    translateY(20px);
  }

  to{
    opacity:1;
    transform:none;
  }

}

.brand{
  font-weight:950;
  font-size:26px;
  letter-spacing:.5px;
  margin-top:24px;
}

.sub{
  color:#a9c8ee;
  letter-spacing:4px;
  font-size:12px;
  margin-top:7px;
}

.primary{
  border:0;
  border-radius:17px;
  padding:17px 20px;

  background:#fff;
  color:#08244c;

  font-weight:900;
  font-size:17px;

  width:100%;
  margin-top:34px;
}

#splash .primary{
  max-width:330px;
  margin-top:48px;
}


/* =========================
   메뉴
========================= */

.kicker{
  font-size:12px;
  letter-spacing:2.5px;
  color:#73a9e7;
  font-weight:800;
}

.title{
  font-size:31px;
  line-height:1.15;
  margin:8px 0;
}

.desc{
  color:var(--muted);
  line-height:1.6;
  margin:0 0 24px;
}

.game-card{

  border:
  1px solid
  var(--line);

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.09),
    rgba(255,255,255,.035)
  );

  color:#fff;

  border-radius:22px;

  padding:22px;

  text-align:left;

  margin:8px 0;

  min-height:135px;
}

.game-card b{
  font-size:21px;
  display:block;
  margin:12px 0 5px;
}

.game-card span{
  color:var(--muted);
  font-size:14px;
}

.icon{
  font-size:32px;
}


/* =========================
   퀴즈
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.back{

  border:
  1px solid
  var(--line);

  background:
  rgba(255,255,255,.06);

  color:#fff;

  border-radius:12px;

  padding:
  10px 13px;
}

.progress{
  font-weight:800;
  color:#bdd0e8;
}

.visual{

  height:340px;

  border:
  1px solid
  var(--line);

  border-radius:24px;

  overflow:hidden;

  background:
  radial-gradient(
    circle at 50% 35%,
    #185eb2,
    #0b326b 55%,
    #071a38
  );

  display:flex;

  align-items:flex-end;

  justify-content:center;

  position:relative;
}

.player-img{
  width:100%;
  height:100%;

  object-fit:contain;

  object-position:
  center bottom;
}

.number{

  font-size:140px;

  font-weight:1000;

  font-style:italic;

  line-height:1;

  text-shadow:
  6px 6px 0
  var(--red);

  align-self:center;
}

.question{

  font-size:21px;

  font-weight:900;

  margin:
  22px 0 14px;
}

.answers{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:10px;
}

.answer{

  border:
  1px solid
  var(--line);

  background:
  rgba(255,255,255,.07);

  color:#fff;

  border-radius:16px;

  padding:
  16px 8px;

  min-height:60px;

  font-weight:800;

  font-size:16px;
}

.answer.correct{

  background:#14754b;

  border-color:#47d18e;
}

.answer.wrong{

  background:#8a2940;

  border-color:#ff6984;
}

.answer:disabled{
  opacity:1;
}


/* =========================
   프로필
========================= */

.result-label{

  text-align:center;

  font-size:22px;

  font-weight:950;

  margin:
  5px 0 17px;

.profile-card{

.no{

.name{

.pos{

.grid{

.info{

.info small{

.info strong{

.note{

  text-align:center;

/* =========================
   결과
========================= */

.score{

.center{

.wrong-list{

</head>

const $ =

/* =====================================
   화면 전환
===================================== */

function show(id){

document
.querySelectorAll(
".screen"
)
.forEach(
screen => {

screen
.classList
.remove(
"active"
);

}
);


$(id)
.classList
.add(
"active"
);


window.scrollTo(
0,
0
);

}


/* =====================================
   랜덤 배열
===================================== */

function shuffle(array){

const result =
[...array];


for(
let i =
result.length - 1;

i > 0;

i--
){

const j =

Math.floor(

Math.random() *
(i + 1)

);


[
result[i],
result[j]

]

=

[
result[j],
result[i]

];

}


return result;

}


/* =====================================
   게임 시작

   ★ 일반 게임은 랜덤 10명
===================================== */

selectedMode,
customPlayers = null
){

selectedMode;

wrong =

*/

players.filter(
player =>
player.image
);

*/

customPlayers
);

/*

 전체 선수 중
 무작위 10명
*/

shuffle(
availablePlayers
)
.slice(

10
);

"quiz"
);

load();

}

class="player-img"
src="${current.image}"
alt="${current.name} 선수 사진">

`;

}


/*
 등번호 맞히기
*/

else{

$("visual")
.innerHTML = `

<div class="number">

${current.number}

</div>

`;

}


createAnswers();

}


/* =====================================
   4지선다 생성
===================================== */

function createAnswers(){

let choices =
[];


/*
 ======================
 한국 선수 문제
 ======================

 한국 선수만 보기로 등장
*/

if(
current.foreign ===
false
){

const koreanPlayers =

players.filter(
player =>

player.foreign === false

&&

player.name !==
current.name
);


const wrongPlayers =

shuffle(
koreanPlayers
)
.slice(
0,
3
);


choices = [

current,
...wrongPlayers

];

}


/*
 ======================
 외국인 선수 문제
 ======================

 외국인 이름만 등장
*/

else{

let foreignPlayers =

players.filter(
player =>

player.foreign === true

&&

player.name !==
current.name
);


foreignPlayers =

shuffle(
foreignPlayers
);


let wrongPlayers =

foreignPlayers
.slice(
0,
3
);


/*
 외국인 선수가 부족할 경우

 다른 K리그 외국인 이름을
 오답으로 사용
*/

if(
wrongPlayers.length <
3
){

const need =

3 -
wrongPlayers.length;


const extra =

shuffle(
foreignDummyPlayers
)
.slice(
0,
need
);


wrongPlayers = [

...wrongPlayers,
...extra

];

}


choices = [

current,
...wrongPlayers

];

}


/*
 보기 순서 랜덤
*/

choices =

shuffle(
choices
);


$("answers")
.innerHTML =
"";


choices
.forEach(
player => {


const button =

document
.createElement(
"button"
);


button.className =
"answer";


button.textContent =
player.name;


button
.addEventListener(
"click",
() => {

answer(
player,
button
);

}
);


$("answers")
.appendChild(
button
);


});

}


/* =====================================
   정답 판정
===================================== */

function answer(
selected,
button
){

const buttons = [

...document
.querySelectorAll(
".answer"
)

];


buttons
.forEach(
button => {

button.disabled =
true;

}
);


const correct =

selected.name ===
current.name;


if(
correct
){

score++;


button
.classList
.add(
"correct"
);

}


else{

wrong.push(
current
);


button
.classList
.add(
"wrong"
);


const correctButton =

buttons.find(
button =>

button.textContent ===
current.name
);


if(
correctButton
){

correctButton
.classList
.add(
"correct"
);

}

}


setTimeout(
() => {

profile(
correct
);

},
500
);

}


/* =====================================
   선수 프로필
===================================== */

function profile(
correct
){

show(
"profile"
);


$("resultLabel")
.textContent =

correct

?

"⭕ 정답입니다!"

:

"❌ 정답은 " +
current.name +
" 선수!";


$("profileImg")
.src =
current.image;


$("profileImg")
.alt =
current.name +
" 선수";


$("pNo")
.textContent =

"NO. " +
current.number;


$("pName")
.textContent =
current.name;


$("pPos")
.textContent =
current.position;


$("pBirth")
.textContent =
current.birth;


$("pPosition")
.textContent =
current.position;


$("pHeight")
.textContent =
current.height;


$("pWeight")
.textContent =
current.weight;


$("pNation")
.textContent =
current.nation;


$("pNumber")
.textContent =
current.number;

}


/* =====================================
   다음 문제
===================================== */

function next(){

idx++;


if(
idx >=
questions.length
){

finish();

return;

}


show(
"quiz"
);


load();

}


/* =====================================
   결과
===================================== */

function finish(){

show(
"result"
);


$("finalScore")
.textContent =

`${score} / ${questions.length}`;


const percent =

Math.round(

score /
questions.length *
100

);


$("scoreText")
.textContent =

"정답률 " +
percent +
"%";


const uniqueWrong = [

...new Map(

wrong.map(
player => [

player.name,
player

])

).values()

];


if(
uniqueWrong.length
){

$("wrongList")
.innerHTML = `

<div
style="
color:#9fb5d2;
margin-bottom:8px;
">

이번 게임에서 틀린 선수

</div>

`

+

uniqueWrong

.map(
player => `

<span class="wrong-chip">

NO.${player.number}
${player.name}

</span>

`
)

.join("");


$("retryWrong")
.style.display =
"block";


$("retryWrong")
.onclick =
() => {

start(
lastMode,
uniqueWrong
);

};

}


else{

$("wrongList")
.innerHTML = `

<div
style="
text-align:center;
font-size:18px;
">

🏆 10문제 전부 맞혔어요!

</div>

`;


$("retryWrong")
.style.display =
"none";

}

}


/* =====================================
   버튼
===================================== */

$("startBtn")
.onclick =
() => {

show(
"menu"
);

};


document
.querySelectorAll(
".game-card"
)
.forEach(
button => {

button.onclick =
() => {

start(
button.dataset.mode
);

};

});


$("menuBtn")
.onclick =
() => {

show(
"menu"
);

};


$("nextBtn")
.onclick =
next;


/*
 새로운 랜덤 10명
*/

$("newGameBtn")
.onclick =
() => {

start(
lastMode
);

};


/*
 메뉴로
*/

$("homeBtn")
.onclick =
() => {

show(
"menu"
);

};

</script>

</body>
</html>
