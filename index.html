<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071c3d">
<title>Bluewings Player Quiz</title>

<style>
:root{
  --blue:#0b4da2;
  --deep:#06152e;
  --red:#e32645;
  --text:#f7fbff;
  --muted:#9fb5d2;
  --line:rgba(255,255,255,.13);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--deep);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
}

.screen{
  display:none;
  min-height:100vh;
  padding:22px 18px 34px;
  max-width:560px;
  margin:auto;
}

.screen.active{
  display:flex;
  flex-direction:column;
}

/* 시작 화면 */

#splash{
  max-width:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 28%,
    #1761ba 0,
    #0b3470 32%,
    #06152e 72%);
}

.crest{
  width:160px;
  max-height:190px;
  object-fit:contain;
  filter:drop-shadow(0 18px 28px rgba(0,0,0,.35));
  animation:pop .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.65) translateY(20px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.brand{
  font-weight:950;
  font-size:26px;
  letter-spacing:.5px;
  margin-top:24px;
}

.sub{
  color:#a9c8ee;
  letter-spacing:4px;
  font-size:12px;
  margin-top:7px;
}

.primary{
  border:0;
  border-radius:17px;
  padding:17px 20px;
  background:#fff;
  color:#08244c;
  font-weight:900;
  font-size:17px;
  width:100%;
  margin-top:34px;
}

#splash .primary{
  max-width:330px;
  margin-top:48px;
}

/* 메뉴 */

.kicker{
  font-size:12px;
  letter-spacing:2.5px;
  color:#73a9e7;
  font-weight:800;
}

.title{
  font-size:31px;
  line-height:1.15;
  margin:8px 0;
}

.desc{
  color:var(--muted);
  line-height:1.6;
  margin:0 0 24px;
}

.game-card{
  border:1px solid var(--line);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  color:#fff;
  border-radius:22px;
  padding:22px;
  text-align:left;
  margin:8px 0;
  min-height:135px;
}

.game-card b{
  font-size:21px;
  display:block;
  margin:12px 0 5px;
}

.game-card span{
  color:var(--muted);
  font-size:14px;
}

.icon{
  font-size:32px;
}

/* 퀴즈 */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.back{
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:#fff;
  border-radius:12px;
  padding:10px 13px;
}

.progress{
  font-weight:800;
  color:#bdd0e8;
}

.visual{
  height:340px;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 35%,
      #185eb2,
      #0b326b 55%,
      #071a38
    );

  display:flex;
  align-items:flex-end;
  justify-content:center;
  position:relative;
}

.player-img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}

.number{
  font-size:140px;
  font-weight:1000;
  font-style:italic;
  line-height:1;
  text-shadow:6px 6px 0 var(--red);
  align-self:center;
}

.question{
  font-size:21px;
  font-weight:900;
  margin:22px 0 14px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  border:1px solid var(--line);
  background:rgba(255,255,255,.07);
  color:#fff;

  border-radius:16px;
  padding:16px 8px;
  min-height:60px;

  font-weight:800;
  font-size:16px;
}

.answer.correct{
  background:#14754b;
  border-color:#47d18e;
}

.answer.wrong{
  background:#8a2940;
  border-color:#ff6984;
}

.answer:disabled{
  opacity:1;
}

/* 프로필 */

.result-label{
  text-align:center;
  font-size:22px;
  font-weight:950;
  margin:5px 0 17px;
}

.profile-card{
  border:1px solid var(--line);

  background:
    linear-gradient(
      155deg,
      #10386f,
      #0a2246
    );

  border-radius:25px;
  overflow:hidden;
}

.profile-photo{
  height:330px;

  background:
    radial-gradient(
      circle at 50% 30%,
      #1b65bb,
      #0a2a5a
    );

  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.profile-photo img{
  height:100%;
  width:100%;
  object-fit:contain;
  object-position:center bottom;
}

.profile-body{
  padding:21px;
}

.no{
  color:#7db5f4;
  font-weight:900;
}

.name{
  font-size:34px;
  font-weight:1000;
  margin:3px 0;
}

.pos{
  color:#d9e8f8;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:19px;
}

.info{
  background:rgba(0,0,0,.18);
  border-radius:14px;
  padding:12px;
}

.info small{
  display:block;
  color:#88a4c5;
  margin-bottom:5px;
}

.info strong{
  font-size:15px;
}

.note{
  color:#8ea7c5;
  font-size:12px;
  text-align:center;
  margin-top:13px;
}

/* 결과 */

.score{
  font-size:78px;
  font-weight:1000;
  margin:14px 0;
}

.center{
  align-items:center;
  justify-content:center;
  text-align:center;
}

.wrong-list{
  width:100%;
  margin-top:20px;
  text-align:left;
}

.wrong-chip{
  display:inline-block;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  padding:8px 11px;
  border-radius:999px;
  margin:4px;
  font-size:13px;
}

@media(max-width:380px){

  .visual{
    height:300px;
  }

  .number{
    font-size:115px;
  }

  .profile-photo{
    height:290px;
  }

  .answers{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<!-- 시작 화면 -->

<section id="splash" class="screen active">

<img
class="crest"
src="https://www.kleague.com/assets/images/emblem/emblem_K02.png"
alt="수원삼성 블루윙즈 엠블럼">

<div class="brand">
SUWON BLUEWINGS
</div>

<div class="sub">
PLAYER QUIZ
</div>

<button
class="primary"
id="startBtn">

게임 시작

</button>

</section>


<!-- 게임 선택 -->

<section id="menu" class="screen">

<div style="margin-top:20px">

<div class="kicker">
2026 BLUEWINGS
</div>

<h1 class="title">
선수들을<br>
얼마나 알고 있나요?
</h1>

<p class="desc">
문제를 푼 뒤 선수 프로필을 확인하면서
얼굴과 등번호를 함께 외워보세요.
</p>

</div>


<button
class="game-card"
data-mode="face">

<div class="icon">👤</div>

<b>
얼굴 보고 맞히기
</b>

<span>
선수 사진을 보고 이름을 맞혀보세요
</span>

</button>


<button
class="game-card"
data-mode="number">

<div class="icon">🔢</div>

<b>
등번호 보고 맞히기
</b>

<span>
등번호만 보고 선수를 맞혀보세요
</span>

</button>

</section>


<!-- 퀴즈 -->

<section id="quiz" class="screen">

<div class="top">

<button
class="back"
id="menuBtn">

← 메뉴

</button>

<div
class="progress"
id="progress">
</div>

</div>


<div
class="visual"
id="visual">
</div>


<div class="question">
이 선수는 누구일까요?
</div>


<div
class="answers"
id="answers">
</div>

</section>


<!-- 프로필 -->

<section id="profile" class="screen">

<div
class="result-label"
id="resultLabel">
</div>


<div class="profile-card">

<div class="profile-photo">

<img
id="profileImg"
alt="">

</div>


<div class="profile-body">

<div
class="no"
id="pNo">
</div>


<div
class="name"
id="pName">
</div>


<div
class="pos"
id="pPos">
</div>


<div class="grid">


<div class="info">

<small>
생년월일
</small>

<strong id="pBirth">
</strong>

</div>


<div class="info">

<small>
포지션
</small>

<strong id="pPosition">
</strong>

</div>


<div class="info">

<small>
신장
</small>

<strong id="pHeight">
</strong>

</div>


<div class="info">

<small>
체중
</small>

<strong id="pWeight">
</strong>

</div>


<div class="info">

<small>
국적
</small>

<strong id="pNation">
</strong>

</div>


<div class="info">

<small>
등번호
</small>

<strong id="pNumber">
</strong>

</div>


</div>
</div>
</div>


<button
class="primary"
id="nextBtn">

다음 선수 →

</button>


<div class="note">
선수 정보 기준: K LEAGUE 공식 등록 정보 · 2026 시즌
</div>

</section>


<!-- 결과 -->

<section
id="result"
class="screen center">

<div class="kicker">
QUIZ COMPLETE
</div>

<h1 class="title">
경기 종료!
</h1>

<div
class="score"
id="finalScore">
</div>

<div
class="desc"
id="scoreText">
</div>


<div
class="wrong-list"
id="wrongList">
</div>


<button
class="primary"
id="retryWrong"
style="display:none">

틀린 선수 다시 풀기

</button>


<button
class="primary"
id="homeBtn"
style="
margin-top:10px;
background:#173b6a;
color:white;
border:1px solid var(--line);
">

게임 선택으로

</button>

</section>


<script>

/* 선수 사진 주소 */

const IMG_BASE =
"https://d2tfp74nsbbrkr.cloudfront.net/v1/player/2026/K02/";


/* 선수 데이터 */

const players = [

{
name:"강성진",
number:22,
position:"FW",
birth:"2003.03.26",
height:"180cm",
weight:"75kg",
nation:"대한민국",
id:"20210079"
},

{
name:"강현묵",
number:17,
position:"MF",
birth:"2001.03.28",
height:"175cm",
weight:"60kg",
nation:"대한민국",
id:"20200035"
},

{
name:"고승범",
number:24,
position:"MF",
birth:"1994.04.24",
height:"173cm",
weight:"70kg",
nation:"대한민국",
id:"20160115"
},

{
name:"고종현",
number:5,
position:"DF",
birth:"2006.04.11",
height:"191cm",
weight:"82kg",
nation:"대한민국",
id:"20230340"
},

{
name:"김준홍",
number:30,
position:"GK",
birth:"2003.06.03",
height:"190cm",
weight:"87kg",
nation:"대한민국",
id:"20210291"
},

{
name:"김지호",
number:71,
position:"FW",
birth:"2003.01.28",
height:"174cm",
weight:"66kg",
nation:"대한민국",
id:"20240309"
},

{
name:"브루노 실바",
number:58,
position:"FW",
birth:"2000.03.28",
height:"176cm",
weight:"70kg",
nation:"브라질",
id:"20240190"
},

{
name:"헤이스",
number:10,
position:"MF",
birth:"1993.01.06",
height:"175cm",
weight:"75kg",
nation:"브라질",
id:"20210261"
},

{
name:"홍정호",
number:20,
position:"DF",
birth:"1989.08.12",
height:"186cm",
weight:"77kg",
nation:"대한민국",
id:"20100163"
},

{
name:"이상민",
number:92,
position:"FW",
birth:"2004.06.29",
height:"175cm",
weight:"60kg",
nation:"대한민국",
id:"20220340"
}

].map(player => ({

...player,

image:
IMG_BASE +
"player_" +
player.id +
".png"

}));


let mode = "face";

let questions = [];

let idx = 0;

let score = 0;

let current = null;

let wrong = [];


/* 편의 함수 */

const $ = id =>
document.getElementById(id);


/* 화면 전환 */

function show(id){

document
.querySelectorAll(".screen")
.forEach(screen =>
screen.classList.remove("active")
);

$(id)
.classList.add("active");

window.scrollTo(0,0);

}


/* 랜덤 섞기 */

function shuffle(array){

const result = [...array];

for(
let i = result.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() *
(i + 1)
);

[
result[i],
result[j]
] = [
result[j],
result[i]
];

}

return result;

}


/* 게임 시작 */

function start(
selectedMode,
customPlayers = null
){

mode = selectedMode;

idx = 0;

score = 0;

wrong = [];

questions =
customPlayers
? shuffle(customPlayers)
: shuffle(players);

show("quiz");

load();

}


/* 문제 불러오기 */

function load(){

current =
questions[idx];

$("progress")
.textContent =
`${idx + 1} / ${questions.length}`;


if(mode === "face"){

$("visual").innerHTML = `

<img
class="player-img"
src="${current.image}"
alt="${current.name} 선수 사진">

`;

}

else{

$("visual").innerHTML = `

<div class="number">
${current.number}
</div>

`;

}


const distractors =
shuffle(
players.filter(
player =>
player.name !== current.name
)
)
.slice(0,3);


const choices =
shuffle([
current,
...distractors
]);


$("answers")
.innerHTML = "";


choices.forEach(player => {

const button =
document.createElement("button");

button.className =
"answer";

button.textContent =
player.name;

button.addEventListener(
"click",
() =>
answer(
player,
button
)
);

$("answers")
.appendChild(
button
);

});

}


/* 정답 선택 */

function answer(
selected,
button
){

const buttons =
[
...document
.querySelectorAll(".answer")
];


buttons.forEach(
button =>
button.disabled = true
);


const correct =
selected.name ===
current.name;


if(correct){

score++;

button
.classList
.add("correct");

}

else{

wrong.push(current);

button
.classList
.add("wrong");


const correctButton =
buttons.find(
button =>
button.textContent ===
current.name
);


if(correctButton){

correctButton
.classList
.add("correct");

}

}


setTimeout(
() =>
profile(correct),
420
);

}


/* 프로필 */

function profile(correct){

show("profile");


$("resultLabel")
.textContent =
correct
? "⭕ 정답입니다!"
: "❌ 정답은 " +
current.name +
" 선수!";


$("profileImg")
.src =
current.image;


$("profileImg")
.alt =
current.name +
" 선수";


$("pNo")
.textContent =
"NO. " +
current.number;


$("pName")
.textContent =
current.name;


$("pPos")
.textContent =
current.position;


$("pBirth")
.textContent =
current.birth;


$("pPosition")
.textContent =
current.position;


$("pHeight")
.textContent =
current.height;


$("pWeight")
.textContent =
current.weight;


$("pNation")
.textContent =
current.nation;


$("pNumber")
.textContent =
current.number;

}


/* 다음 문제 */

function next(){

idx++;


if(
idx >=
questions.length
){

finish();

return;

}


show("quiz");

load();

}


/* 게임 종료 */

function finish(){

show("result");


$("finalScore")
.textContent =
`${score} / ${questions.length}`;


$("scoreText")
.textContent =
"정답률 " +
Math.round(
score /
questions.length *
100
) +
"%";


const uniqueWrong =
[
...new Map(
wrong.map(
player =>
[
player.name,
player
]
)
).values()
];


if(uniqueWrong.length){

$("wrongList")
.innerHTML = `

<div
style="
color:#9fb5d2;
margin-bottom:7px;
">

틀린 선수

</div>

` +

uniqueWrong
.map(
player => `

<span class="wrong-chip">

NO.${player.number}
${player.name}

</span>

`
)
.join("");


$("retryWrong")
.style.display =
"block";


$("retryWrong")
.onclick =
() =>
start(
mode,
uniqueWrong
);

}

else{

$("wrongList")
.innerHTML = `

<div
style="
text-align:center;
">

🏆 전부 맞혔어요!

</div>

`;


$("retryWrong")
.style.display =
"none";

}

}


/* 버튼 */

$("startBtn")
.onclick =
() =>
show("menu");


document
.querySelectorAll(".game-card")
.forEach(
button => {

button.onclick =
() =>
start(
button.dataset.mode
);

});


$("menuBtn")
.onclick =
() =>
show("menu");


$("nextBtn")
.onclick =
next;


$("homeBtn")
.onclick =
() =>
show("menu");

</script>

</body>
</html>
