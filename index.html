<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071c3d">

<title>Bluewings Player Quiz</title>

<style>
:root{
  --blue:#0b4da2;
  --deep:#06152e;
  --red:#e32645;
  --text:#f7fbff;
  --muted:#9fb5d2;
  --line:rgba(255,255,255,.13);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--deep);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.screen{
  display:none;
  min-height:100vh;
  padding:22px 18px 34px;
  max-width:560px;
  margin:auto;
}

.screen.active{
  display:flex;
  flex-direction:column;
}


/* START */

#splash{
  max-width:none;
  align-items:center;
  justify-content:center;
  text-align:center;

  background:
  radial-gradient(
    circle at 50% 28%,
    #1761ba 0,
    #0b3470 32%,
    #06152e 72%
  );
}

.crest{
  width:160px;
  max-height:190px;
  object-fit:contain;
  filter:drop-shadow(0 18px 28px rgba(0,0,0,.35));
  animation:pop .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.65) translateY(20px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.brand{
  font-weight:950;
  font-size:26px;
  margin-top:24px;
}

.sub{
  color:#a9c8ee;
  letter-spacing:4px;
  font-size:12px;
  margin-top:7px;
}

.primary{
  border:0;
  border-radius:17px;
  padding:17px 20px;
  background:#fff;
  color:#08244c;
  font-weight:900;
  font-size:17px;
  width:100%;
  margin-top:25px;
}

#splash .primary{
  max-width:330px;
  margin-top:48px;
}


/* MENU */

.kicker{
  font-size:12px;
  letter-spacing:2.5px;
  color:#73a9e7;
  font-weight:800;
}

.title{
  font-size:31px;
  line-height:1.15;
  margin:8px 0;
}

.desc{
  color:var(--muted);
  line-height:1.6;
  margin:0 0 24px;
}

.game-card{
  border:1px solid var(--line);

  background:
  linear-gradient(
    145deg,
    rgba(255,255,255,.09),
    rgba(255,255,255,.035)
  );

  color:white;
  border-radius:22px;
  padding:22px;
  text-align:left;
  margin:8px 0;
  min-height:125px;
}

.game-card b{
  font-size:21px;
  display:block;
  margin:10px 0 5px;
}

.game-card span{
  color:var(--muted);
  font-size:14px;
}

.icon{
  font-size:30px;
}


/* DIFFICULTY */

.difficulty-card{
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:white;
  border-radius:22px;
  padding:24px;
  margin:9px 0;
  text-align:left;
}

.difficulty-card b{
  display:block;
  font-size:24px;
  margin-bottom:7px;
}

.difficulty-card span{
  color:var(--muted);
  line-height:1.5;
}

.hard-card{
  border-color:rgba(227,38,69,.55);

  background:
  linear-gradient(
    145deg,
    rgba(227,38,69,.16),
    rgba(255,255,255,.035)
  );
}


/* QUIZ */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.back{
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:white;
  border-radius:12px;
  padding:10px 13px;
}

.progress{
  font-weight:800;
  color:#bdd0e8;
}

.difficulty-badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  margin-bottom:10px;
  letter-spacing:1px;
}

.normal-badge{
  background:#185ca9;
}

.hard-badge{
  background:#b8233d;
}

.visual{
  height:340px;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;

  background:
  radial-gradient(
    circle at 50% 35%,
    #185eb2,
    #0b326b 55%,
    #071a38
  );

  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.player-img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}

.number{
  font-size:140px;
  font-weight:1000;
  font-style:italic;
  line-height:1;
  text-shadow:6px 6px 0 var(--red);
  align-self:center;
}

.question{
  font-size:21px;
  font-weight:900;
  margin:22px 0 14px;
}


/* NORMAL ANSWERS */

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  border:1px solid var(--line);
  background:rgba(255,255,255,.07);
  color:white;
  border-radius:16px;
  padding:16px 8px;
  min-height:60px;
  font-weight:800;
  font-size:16px;
}

.answer.correct{
  background:#14754b;
  border-color:#47d18e;
}

.answer.wrong{
  background:#8a2940;
  border-color:#ff6984;
}


/* HARD INPUT */

.hard-answer{
  display:none;
}

.name-input{
  width:100%;
  height:62px;
  border-radius:17px;
  border:2px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  color:white;
  padding:0 18px;
  font-size:20px;
  font-weight:800;
  outline:none;
}

.name-input::placeholder{
  color:#7189a7;
}

.name-input:focus{
  border-color:#4c91df;
}

.submit-answer{
  width:100%;
  border:0;
  border-radius:17px;
  padding:17px;
  background:#0b4da2;
  color:white;
  font-weight:900;
  font-size:17px;
  margin-top:10px;
}

.hard-help{
  color:#7794b7;
  font-size:12px;
  margin-top:10px;
  text-align:center;
}


/* PROFILE */

.result-label{
  text-align:center;
  font-size:22px;
  font-weight:950;
  margin:5px 0 17px;
}

.profile-card{
  border:1px solid var(--line);
  background:linear-gradient(155deg,#10386f,#0a2246);
  border-radius:25px;
  overflow:hidden;
}

.profile-photo{
  height:330px;

  background:
  radial-gradient(
    circle at 50% 30%,
    #1b65bb,
    #0a2a5a
  );

  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}

.profile-body{
  padding:21px;
}

.no{
  color:#7db5f4;
  font-weight:900;
}

.name{
  font-size:34px;
  font-weight:1000;
  margin:3px 0;
}

.pos{
  color:#d9e8f8;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:19px;
}

.info{
  background:rgba(0,0,0,.18);
  border-radius:14px;
  padding:12px;
}

.info small{
  display:block;
  color:#88a4c5;
  margin-bottom:5px;
}

.note{
  color:#8ea7c5;
  font-size:12px;
  text-align:center;
  margin-top:13px;
}


/* RESULT */

.center{
  align-items:center;
  justify-content:center;
  text-align:center;
}

.score{
  font-size:78px;
  font-weight:1000;
  margin:14px 0;
}

.wrong-list{
  width:100%;
  margin-top:20px;
  text-align:left;
}

.wrong-chip{
  display:inline-block;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  padding:8px 11px;
  border-radius:999px;
  margin:4px;
  font-size:13px;
}

@media(max-width:380px){

  .visual{
    height:300px;
  }

  .number{
    font-size:115px;
  }

  .answers{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>


<!-- START -->

<section id="splash" class="screen active">

<img
class="crest"
src="https://www.kleague.com/assets/images/emblem/emblem_K02.png">

<div class="brand">
SUWON BLUEWINGS
</div>

<div class="sub">
PLAYER QUIZ
</div>

<button
class="primary"
id="startBtn">

게임 시작

</button>

</section>


<!-- GAME TYPE -->

<section id="menu" class="screen">

<div style="margin-top:20px">

<div class="kicker">
2026 BLUEWINGS
</div>

<h1 class="title">
어떤 퀴즈를<br>
플레이할까요?
</h1>

<p class="desc">
매 게임마다 무작위 선수 10명이 등장합니다.
</p>

</div>


<button
class="game-card"
data-mode="face">

<div class="icon">👤</div>

<button
class="game-card"
data-mode="number">

<div class="icon">🔢</div>

등번호 보고 맞히기
</b>

등번호만 보고 선수를 맞혀보세요
</span>

</button>

</section>


<!-- DIFFICULTY -->

<section id="difficulty" class="screen">

<button
class="back"
id="difficultyBack">

← 게임 선택

</button>

<div style="margin-top:30px">

<div class="kicker">
SELECT LEVEL
</div>

<h1 class="title">
난이도를<br>
선택하세요
</h1>

<p class="desc">
같은 10문제지만 정답 방식이 달라집니다.
</p>

</div>


<button
class="difficulty-card"
data-level="normal">

<b>
⚽ Normal
</b>

<span>
4개의 선수 이름 중 정답을 선택합니다.
</span>

</button>


<button
class="difficulty-card hard-card"
data-level="hard">

<b>
🔥 Hard
</b>

<span>
보기 없이 선수 이름을 직접 입력합니다.
</span>

</button>

</section>


<!-- QUIZ -->

<section id="quiz" class="screen">

<div class="top">

<button
class="back"
id="quizBack">

← 메뉴

</button>

<div
class="progress"
id="progress">
</div>

</div>


<div
id="difficultyBadge"
class="difficulty-badge">
</div>


<div
class="visual"
id="visual">
</div>

<!-- NORMAL -->

<div
class="answers"

</div>


<!-- HARD -->

<div
class="hard-answer"
id="hardAnswer">

<input
id="nameInput"
class="name-input"
type="text"
autocomplete="off"
autocorrect="off"

placeholder="선수 이름 입력">

<button
id="submitAnswer"
class="submit-answer">

정답 확인

</button>

<div class="hard-help">

띄어쓰기는 정답에 영향을 주지 않습니다.

</div>

</div>

</section>


<!-- PROFILE -->

<section id="profile" class="screen">

<div
class="result-label"
id="resultLabel">
</div>


<div class="profile-card">

<div class="profile-photo">

<img
id="profileImg">

</div>


<div class="profile-body">

<div
class="no"
id="pNo">
</div>

<div
class="name"
id="pName">
</div>

<div
class="pos"
id="pPos">
</div>


<div class="grid">

<div class="info">
<small>생년월일</small>
<strong id="pBirth"></strong>
</div>

<div class="info">
<small>포지션</small>
<strong id="pPosition"></strong>
</div>

<div class="info">
<small>신장</small>
<strong id="pHeight"></strong>
</div>

<div class="info">
<small>체중</small>
<strong id="pWeight"></strong>
</div>

<div class="info">
<small>국적</small>
<strong id="pNation"></strong>
</div>

<div class="info">
<small>등번호</small>
<strong id="pNumber"></strong>
</div>

</div>

</div>
</div>


<button
class="primary"
id="nextBtn">

다음 선수 →

</button>

</section>


<!-- RESULT -->

<section
id="result"
class="screen center">

<div class="kicker">
QUIZ COMPLETE
</div>

<h1 class="title">
경기 종료!
</h1>

<div
class="score"
id="finalScore">
</div>

<div
class="desc"
id="scoreText">
</div>

<div
class="wrong-list"
id="wrongList">
</div>


<button
class="primary"
id="retryWrong"
style="display:none">

틀린 선수 다시 풀기

</button>


<button
class="primary"
id="newGameBtn"
style="background:#0b4da2;color:white">

새로운 랜덤 10명

</button>


<button
class="primary"
id="homeBtn"
style="background:#173b6a;color:white">

게임 선택으로

</button>

</section>


<script>


/* =========================
   PLAYER IMAGES
========================= */

const IMG_BASE =
"https://d2tfp74nsbbrkr.cloudfront.net/v1/player/2026/K02/";

const image = id =>
IMG_BASE + "player_" + id + ".png";


/* =========================
   FOREIGN DUMMY ANSWERS
========================= */

const foreignDummyPlayers = [

{name:"세징야",foreign:true},
{name:"라마스",foreign:true},
{name:"오베르단",foreign:true},
{name:"가브리엘",foreign:true},
{name:"플라나",foreign:true},
{name:"마테우스",foreign:true}

];


/* =========================
   PLAYERS
========================= */

const players = [

{name:"양형모",number:21,position:"GK",birth:"1991.07.16",height:"185cm",weight:"84kg",nation:"대한민국",foreign:false,id:"20140081"},

{name:"김준홍",number:30,position:"GK",birth:"2003.06.03",height:"190cm",weight:"87kg",nation:"대한민국",foreign:false,id:"20210291"},

{name:"모경빈",number:3,position:"DF",birth:"2007.03.24",height:"186cm",weight:"78kg",nation:"대한민국",foreign:false,id:"20260240"},

{name:"송주훈",number:4,position:"DF",birth:"1994.01.13",height:"190cm",weight:"83kg",nation:"대한민국",foreign:false,id:"20190049"},

{name:"고종현",number:5,position:"DF",birth:"2006.04.11",height:"191cm",weight:"82kg",nation:"대한민국",foreign:false,id:"20230340"},

{name:"이준재",number:11,position:"DF",birth:"2003.07.14",height:"180cm",weight:"67kg",nation:"대한민국",foreign:false,id:"20220152"},

{name:"최지묵",number:18,position:"DF",birth:"1998.10.09",height:"178cm",weight:"70kg",nation:"대한민국",foreign:false,id:"20200162"},

{name:"홍정호",number:20,position:"DF",birth:"1989.08.12",height:"186cm",weight:"77kg",nation:"대한민국",foreign:false,id:"20100163"},

{name:"정동윤",number:32,position:"DF",birth:"1994.04.03",height:"175cm",weight:"72kg",nation:"대한민국",foreign:false,id:"20160236"},

{name:"박대원",number:33,position:"DF",birth:"1998.02.25",height:"178cm",weight:"76kg",nation:"대한민국",foreign:false,id:"20190142"},

{name:"한현서",number:66,position:"DF",birth:"2004.01.02",height:"187cm",weight:"76kg",nation:"대한민국",foreign:false,id:"20250017"},

{
name:"김지호",
number:71,
position:"DF",
birth:"2003.01.28",
height:"174cm",
weight:"66kg",
nation:"대한민국",
foreign:false,
id:"20240309",
customImage:
"https://d2tfp74nsbbrkr.cloudfront.net/v1/player/player_20240309.png"
},

{name:"임지훈",number:6,position:"MF",birth:"2005.03.04",height:"188cm",weight:"84kg",nation:"대한민국",foreign:false,id:"20240151"},

{name:"페신",number:7,position:"MF",birth:"1999.01.04",height:"178cm",weight:"69kg",nation:"브라질",foreign:true,id:"20230163"},

{name:"정호연",number:14,position:"MF",birth:"2000.09.28",height:"180cm",weight:"73kg",nation:"대한민국",foreign:false,id:"20220145"},

{name:"박현빈",number:16,position:"MF",birth:"2003.05.19",height:"177cm",weight:"72kg",nation:"대한민국",foreign:false,id:"20220114"},

{name:"강현묵",number:17,position:"MF",birth:"2001.03.28",height:"175cm",weight:"60kg",nation:"대한민국",foreign:false,id:"20200035"},

{name:"고승범",number:24,position:"MF",birth:"1994.04.24",height:"173cm",weight:"70kg",nation:"대한민국",foreign:false,id:"20160115"},

{name:"헤이스",number:10,position:"FW",birth:"1993.01.06",height:"175cm",weight:"75kg",nation:"브라질",foreign:true,id:"20210261"},

{name:"브루노 실바",number:58,position:"FW",birth:"2000.03.28",height:"176cm",weight:"70kg",nation:"브라질",foreign:true,id:"20240190"},

{name:"김지현",number:77,position:"FW",birth:"1996.07.22",height:"183cm",weight:"79kg",nation:"대한민국",foreign:false,id:"20180118"},

{name:"김결",number:90,position:"FW",birth:"2005.01.14",height:"188cm",weight:"81kg",nation:"대한민국",foreign:false,id:"20240191"},

{name:"이상민",number:92,position:"FW",birth:"2004.06.29",height:"175cm",weight:"60kg",nation:"대한민국",foreign:false,id:"20220340"},

{name:"김도연",number:99,position:"FW",birth:"2005.02.22",height:"183cm",weight:"76kg",nation:"대한민국",foreign:false,id:"20260243"}

].map(player => ({

...player,

image:
player.customImage
?
player.customImage
:
image(player.id)

}));


/* =========================
   STATE
========================= */

let mode = "face";
let difficulty = "normal";

let selectedMode = "face";

let questions = [];
let idx = 0;
let score = 0;
let current = null;
let wrong = [];

let lastMode = "face";
let lastDifficulty = "normal";


const $ = id =>
document.getElementById(id);


/* =========================
   SCREEN
========================= */

function show(id){

document
.querySelectorAll(".screen")
.forEach(screen =>
screen.classList.remove("active")
);

$(id)
.classList.add("active");

window.scrollTo(0,0);

}


/* =========================
   SHUFFLE
========================= */

function shuffle(array){

const result = [...array];

for(
let i = result.length - 1;
i > 0;
i--
){

const j =
Math.floor(
Math.random() *
(i + 1)
);

[
result[i],
result[j]
] = [
result[j],
result[i]
];

}

return result;

}


/* =========================
   START
========================= */

function start(
gameMode,
gameDifficulty,
customPlayers = null
){

mode = gameMode;

difficulty =
gameDifficulty;

lastMode =
gameMode;

lastDifficulty =
gameDifficulty;

idx = 0;
score = 0;
wrong = [];


let availablePlayers =
players;


if(customPlayers){

questions =
shuffle(customPlayers);

}

else{

questions =
shuffle(
availablePlayers
)
.slice(0,10);

}


show("quiz");

load();

}


/* =========================
   LOAD QUESTION
========================= */

function load(){

current =
questions[idx];


$("progress")
.textContent =
`${idx + 1} / ${questions.length}`;


/* badge */

const badge =
$("difficultyBadge");

if(
difficulty ===
"hard"
){

badge.textContent =
"HARD";

badge.className =
"difficulty-badge hard-badge";

}

else{

badge.textContent =
"NORMAL";

badge.className =
"difficulty-badge normal-badge";

}


/* FACE */

if(
mode ===
"face"
){

$("visual")
.innerHTML = `

<img
class="player-img"
src="${current.image}"
alt="${current.name} 선수 사진">

`;

}


/* NUMBER */

else{

$("visual")
.innerHTML = `

<div class="number">
${current.number}
</div>

`;

}


/* NORMAL */

if(
difficulty ===
"normal"
){

$("answers")
.style.display =
"grid";

$("hardAnswer")
.style.display =
"none";

createNormalAnswers();

}


/* HARD */

else{

$("answers")
.style.display =
"none";

$("hardAnswer")
.style.display =
"block";

$("nameInput")
.value =
"";

setTimeout(
() =>
$("nameInput").focus(),
200
);

}

}


/* =========================
   NORMAL ANSWERS
========================= */

function createNormalAnswers(){

let choices;


/* Korean */

if(
current.foreign ===
false
){

const pool =
players.filter(
player =>
!player.foreign &&
player.name !== current.name
);

choices = [

current,

...shuffle(pool)
.slice(0,3)

];

}


/* Foreign */

else{

let pool =
players.filter(
player =>
player.foreign &&
player.name !== current.name
);


let wrongAnswers =
shuffle(pool)
.slice(0,3);


if(
wrongAnswers.length <
3
){

wrongAnswers = [

...wrongAnswers,

...shuffle(
foreignDummyPlayers
)
.slice(
0,
3 -
wrongAnswers.length
)

];

}


choices = [

current,
...wrongAnswers

];

}


choices =
shuffle(choices);


$("answers")
.innerHTML =
"";


choices.forEach(player => {

const button =
document.createElement("button");

button.className =
"answer";

button.textContent =
player.name;

button.onclick =
() =>
normalAnswer(
player,
button
);

$("answers")
.appendChild(
button
);

});

}


/* =========================
   NORMAL CHECK
========================= */

function normalAnswer(
selected,
button
){

const buttons = [

...document
.querySelectorAll(".answer")

];


buttons.forEach(
b =>
b.disabled = true
);


const correct =
selected.name ===
current.name;


if(correct){

score++;

button.classList.add(
"correct"
);

}

else{

wrong.push(current);

button.classList.add(
"wrong"
);


const correctButton =
buttons.find(
b =>
b.textContent ===
current.name
);


if(correctButton){

correctButton
.classList.add(
"correct"
);

}

}


setTimeout(
() =>
profile(correct),
450
);

}


/* =========================
   HARD NAME NORMALIZATION

   공백 무시
   대소문자 무시
========================= */

function normalizeName(name){

return name

.trim()

.replace(
(/\s+/g),
""
)

.toLowerCase();

}


/* =========================
   HARD CHECK
========================= */

function checkHardAnswer(){

const input =
$("nameInput")
.value;


if(
input.trim() ===
""
){

$("nameInput")
.focus();

return;

}


const userAnswer =
normalizeName(input);


const correctAnswer =
normalizeName(
current.name
);


const correct =
userAnswer ===
correctAnswer;


if(correct){

score++;

}

else{

wrong.push(
current
);

}


profile(
correct,
input
);

}


/* ENTER KEY */

$("nameInput")
.addEventListener(
"keydown",
event => {

if(
event.key ===
"Enter"
){

checkHardAnswer();

}

});


/* =========================
   PROFILE
========================= */

function profile(
correct,
typedAnswer = null
){

show(
"profile"
);


if(correct){

$("resultLabel")
.textContent =
"⭕ 정답입니다!";

}

else if(
difficulty ===
"hard" &&
typedAnswer
){

$("resultLabel")
.innerHTML =

`❌ <span style="color:#91a9c5">
${typedAnswer}
</span><br>
정답은 ${current.name} 선수!`;

}

else{

$("resultLabel")
.textContent =

"❌ 정답은 " +
current.name +
" 선수!";

}


$("profileImg")
.src =
current.image;


$("pNo")
.textContent =
"NO. " +
current.number;


$("pName")
.textContent =
current.name;


$("pPos")
.textContent =
current.position;


$("pBirth")
.textContent =
current.birth;


$("pPosition")
.textContent =
current.position;


$("pHeight")
.textContent =
current.height;


$("pWeight")
.textContent =
current.weight;


$("pNation")
.textContent =
current.nation;


$("pNumber")
.textContent =
current.number;

}


/* =========================
   NEXT
========================= */

function next(){

idx++;


if(
idx >=
questions.length
){

finish();

return;

}


show("quiz");

load();

}


/* =========================
   RESULT
========================= */

function finish(){

show("result");


$("finalScore")
.textContent =
`${score} / ${questions.length}`;


const percent =
Math.round(
score /
questions.length *
100
);


$("scoreText")
.textContent =

`${lastDifficulty === "hard" ? "🔥 HARD" : "⚽ NORMAL"} · 정답률 ${percent}%`;


const uniqueWrong = [

...new Map(

wrong.map(
player => [
player.name,
player
]
)

).values()

];


if(
uniqueWrong.length
){

$("wrongList")
.innerHTML =

`
<div style="
color:#9fb5d2;
margin-bottom:8px;
">

이번 게임에서 틀린 선수

</div>
`

+

uniqueWrong
.map(
player =>

`
<span class="wrong-chip">

NO.${player.number}
${player.name}

</span>
`

)
.join("");


$("retryWrong")
.style.display =
"block";


$("retryWrong")
.onclick =
() =>

start(
lastMode,
lastDifficulty,
uniqueWrong
);

}

else{

$("wrongList")
.innerHTML =

`
<div style="
text-align:center;
font-size:18px;
">

🏆 10문제 전부 맞혔어요!

</div>
`;


$("retryWrong")
.style.display =
"none";

}

}


/* =========================
   BUTTONS
========================= */

$("startBtn")
.onclick =
() =>
show("menu");


/* FACE / NUMBER */

document
.querySelectorAll(
".game-card"
)
.forEach(
button => {

button.onclick =
() => {

selectedMode =
button.dataset.mode;

show(
"difficulty"
);

};

});


/* DIFFICULTY */

document
.querySelectorAll(
".difficulty-card"
)
.forEach(
button => {

button.onclick =
() => {

start(
selectedMode,
button.dataset.level
);

};

});


$("difficultyBack")
.onclick =
() =>
show("menu");


$("quizBack")
.onclick =
() =>
show("menu");


$("submitAnswer")
.onclick =
checkHardAnswer;


$("nextBtn")
.onclick =
next;


/* NEW RANDOM GAME */

$("newGameBtn")
.onclick =
() =>

start(
lastMode,
lastDifficulty
);


/* HOME */

$("homeBtn")
.onclick =
() =>
show("menu");

</script>

</body>
</html>
